# ===== Red (lo leen el servidor y la app del paciente) =====
# IP del servidor. En el mismo PC: 127.0.0.1. En PCs distintos: la IP del servidor.
server.ip=127.0.0.1
server.port=9000

# ===== Servidor =====
# Carpeta donde se guardan pacientes, sintomas, sesiones y senales
data.dir=data

# ===== App del paciente =====
# bitalino = placa real ; simulated = datos sinteticos
signal.source=bitalino
bitalino.mac=20:18:08:08:01:40
# Frecuencia de muestreo en Hz: 1, 10, 100 o 1000
bitalino.fs=1000
# Canales analogicos: A1 EMG, A2-A4 acelerometro X/Y/Z
bitalino.channels=0,1,2,3
#Tiempo máximo (ms) sin recibir datos del BITalino antes de dar la lectura por fallida
bitalino.readTimeoutMs=3000
# Duracion maxima de cada sesion, en segundos
session.duration=60